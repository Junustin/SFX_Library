<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFX Library</title>

    <link rel="stylesheet" href="css/site.css">
</head>

<body>

    <header>
        <h1>SFX Library</h1>
    </header>

    <main>

        <section class="search-section">
            <h2>Search</h2>
            <div>
                <input class="search-bar" type="text" placeholder="Search sound effects">
                <button class="search-button">Search</button>
            </div>
        </section>

        <section>
            <div class="sound-header">
                <h2>Sound Effects</h2>

                <div hidden id="loading-message">
                    <h4>Loading...</h4>
                </div>

                <div hidden id="error-message">

                    <h3 class="error-text">Error </h3>
                    <button class="tryagain-button">Try again?</button>
                </div>
            </div>
    
            <div class="sound-list">
                <!--App create sound card and will put in this list.-->
            </div>
        </section>

        <section>
            <div class="pagination-button">

            </div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
