services:
  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jrust.pgrs
      POSTGRES_DB: SfxLibrary
    volumes:
      - postgres_data:/var/lib/postgresql/

volumes:
  postgres_data: