services:
  redis:
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: SfxLibrary
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SfxLibrary"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./SoundEffectLibrary.Api
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=SfxLibrary;Username=postgres;Password=${POSTGRES_PASSWORD}"

      ConnectionStrings__Redis: "redis:6379"

      Jwt__SigningKey: ${JWT_SIGNING_KEY}

      AudioStorage__RootPath: "/app/audio"

    volumes:
      - "./data/audio:/app/audio"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: